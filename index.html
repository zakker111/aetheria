<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - God Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
        }
        
        #tools {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        
        .tool-button {
            padding: 8px 12px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 4px;
            color: #eee;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .tool-button:hover {
            background: #0f3460;
        }
        
        .tool-button.active {
            background: #e94560;
            border-color: #e94560;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        
        .control-button {
            padding: 8px 16px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 4px;
            color: #eee;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .control-button:hover {
            background: #0f3460;
        }
        
        #info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 300px;
        }
        
        h3 {
            margin-bottom: 10px;
            color: #e94560;
        }
        
        .stat {
            margin: 5px 0;
        }
        
        .stat-label {
            color: #888;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <h3>Aetheria</h3>
        <div class="stat"><span class="stat-label">Day:</span> <span id="day">1</span></div>
        <div class="stat"><span class="stat-label">Hour:</span> <span id="hour">0</span></div>
        <div class="stat"><span class="stat-label">Agents:</span> <span id="agents">0</span></div>
        <div class="stat"><span class="stat-label">Resources:</span> <span id="resources">0</span></div>
        <div class="stat"><span class="stat-label">Speed:</span> <span id="speed">1x</span></div>
    </div>
    
    <div id="tools">
        <button class="tool-button active" data-tool="spawn_agent">Spawn Agent (1)</button>
        <button class="tool-button" data-tool="create_food">Food (2)</button>
        <button class="tool-button" data-tool="create_water">Water (3)</button>
        <button class="tool-button" data-tool="create_wood">Wood (4)</button>
        <button class="tool-button" data-tool="create_ore">Ore (5)</button>
        <button class="tool-button" data-tool="remove">Remove (6)</button>
    </div>
    
    <div id="controls">
        <button class="control-button" id="pauseBtn">Pause</button>
        <button class="control-button" id="speedBtn">Speed</button>
        <button class="control-button" id="saveBtn">Save</button>
        <button class="control-button" id="loadBtn">Load</button>
    </div>
    
    <div id="info">
        <h3>Controls</h3>
        <div>Drag to pan</div>
        <div>Scroll to zoom</div>
        <div>Click to use tool</div>
        <div>1-6 to select tool</div>
        <div>Space to pause</div>
    </div>

    <script type="module">
        import { Simulation } from "./src/simulation/simulation.js";
        import { CanvasRenderer } from "./src/presentation/renderer.js";
        import { Interaction } from "./src/interaction/godPowers.js";

        const canvas = document.getElementById("gameCanvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const simulation = new Simulation();
        const renderer = new CanvasRenderer(canvas, simulation.world, simulation);
        const interaction = new Interaction(simulation, renderer);

        let lastTime = 0;
        const TICK_RATE = 100;

        function gameLoop(currentTime) {
            const deltaTime = currentTime - lastTime;
            
            if (deltaTime >= TICK_RATE / simulation.clock.speed) {
                if (simulation.clock.speed > 0) {
                    simulation.tick();
                }
                lastTime = currentTime;
            }
            
            renderer.render();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            const time = simulation.clock.getTime();
            document.getElementById("day").textContent = time.days + 1;
            document.getElementById("hour").textContent = time.hours;
            document.getElementById("agents").textContent = simulation.agents.length;
            document.getElementById("resources").textContent = simulation.resources.length;
            document.getElementById("speed").textContent = simulation.clock.speed + "x";
        }

        document.querySelectorAll(".tool-button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tool-button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                interaction.setTool(btn.dataset.tool);
            });
        });

        document.getElementById("pauseBtn").addEventListener("click", () => {
            if (simulation.clock.speed > 0) {
                simulation.clock.pause();
                document.getElementById("pauseBtn").textContent = "Play";
            } else {
                simulation.clock.setSpeed(1);
                document.getElementById("pauseBtn").textContent = "Pause";
            }
        });

        document.getElementById("speedBtn").addEventListener("click", () => {
            const speeds = [1, 2, 5, 10];
            const currentIdx = speeds.indexOf(simulation.clock.speed);
            const nextIdx = (currentIdx + 1) % speeds.length;
            simulation.clock.setSpeed(speeds[nextIdx]);
        });

        document.getElementById("saveBtn").addEventListener("click", () => {
            const data = simulation.serialize();
            localStorage.setItem("aetheria_save", JSON.stringify(data));
            alert("Game saved!");
        });

        document.getElementById("loadBtn").addEventListener("click", () => {
            const data = localStorage.getItem("aetheria_save");
            if (data) {
                const loaded = Simulation.deserialize(JSON.parse(data));
                Object.assign(simulation, loaded);
                alert("Game loaded!");
            } else {
                alert("No save found!");
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                document.getElementById("pauseBtn").click();
            }
        });

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        requestAnimationFrame(gameLoop);

        console.log("Aetheria initialized!");
    </script>
</body>
</html>
