<!DOCTYPE html>
<html>
<head>
    <title>Game Test</title>
</head>
<body>
    <h1>Game Functionality Test</h1>
    <div id="results"></div>
    <script type="module">
        import { Simulation } from './src/simulation/simulation.js';
        
        const results = document.getElementById('results');
        let output = '';
        
        function log(msg) {
            output += msg + '<br>';
            results.innerHTML = output;
        }
        
        try {
            log('<h2>Test 1: Simulation Creation</h2>');
            const sim = new Simulation();
            log(`✓ Simulation created - Agents: ${sim.agents.length}, Resources: ${sim.resources.length}`);
            
            log('<h2>Test 2: Spawn Agent</h2>');
            const agent = sim.spawnAgent(32, 32);
            log(`✓ Agent spawned at (${agent.x}, ${agent.y})`);
            
            log('<h2>Test 3: Create Resources</h2>');
            sim.createResource(10, 10, 'food', 50);
            sim.createResource(15, 15, 'water', 100);
            sim.createResource(20, 20, 'wood', 30);
            sim.createResource(25, 25, 'ore', 20);
            log(`✓ Resources created - Total: ${sim.resources.length}`);
            
            log('<h2>Test 4: Run Simulation Ticks</h2>');
            for (let i = 0; i < 20; i++) {
                sim.tick();
            }
            log(`✓ Ran 20 ticks - Agents: ${sim.agents.length}, Time: Day ${sim.clock.getTime().days}, Hour ${sim.clock.getTime().hours}`);
            
            log('<h2>Test 5: Check Settlements</h2>');
            const settlements = sim.settlementSystem.settlements;
            log(`✓ Settlement system active - Settlements: ${settlements.size}`);
            
            log('<h2>Test 6: Event System</h2>');
            log(`✓ Event system initialized - Active events: ${sim.eventSystem.activeEvents.length}`);
            
            log('<h2>All Tests Passed!</h2>');
        } catch (e) {
            log(`<strong style="color:red">ERROR: ${e.message}</strong>`);
            log(e.stack);
        }
    </script>
</body>
</html>
