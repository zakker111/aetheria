<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: monospace; overflow: hidden; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
        #log { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 8px; max-width: 400px; max-height: 80vh; overflow-y: auto; font-size: 12px; }
        .log-entry { margin: 3px 0; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="log"><h3>Debug Log</h3><div id="logContent"></div></div>
    
    <script type="module">
        const logDiv = document.getElementById('logContent');
        function log(msg, type='info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        try {
            log('Loading modules...', 'info');
            
            import('./src/simulation/simulation.js')
                .then(({ Simulation }) => {
                    log('✓ Simulation module loaded', 'success');
                    
                    try {
                        const sim = new Simulation();
                        log(`✓ Simulation created with ${sim.agents.length} agents`, 'success');
                        log(`World size: ${sim.world.width}x${sim.world.height}`, 'info');
                        
                        // Test terrain generation
                        let terrainTypes = new Set();
                        for (let y = 0; y < sim.world.height; y++) {
                            for (let x = 0; x < sim.world.width; x++) {
                                const t = sim.world.getTerrain(x, y);
                                if (t) terrainTypes.add(t.type);
                            }
                        }
                        log(`Terrain types found: ${Array.from(terrainTypes).join(', ')}`, 'info');
                        
                        import('./src/presentation/renderer.js')
                            .then(({ CanvasRenderer }) => {
                                log('✓ Renderer module loaded', 'success');
                                
                                const canvas = document.getElementById('gameCanvas');
                                canvas.width = window.innerWidth;
                                canvas.height = window.innerHeight;
                                
                                const renderer = new CanvasRenderer(canvas, sim.world, sim);
                                log('✓ Renderer initialized', 'success');
                                log(`Camera at (${renderer.camera.x.toFixed(1)}, ${renderer.camera.y.toFixed(1)}) zoom: ${renderer.camera.zoom}x`, 'info');
                                
                                import('./src/interaction/godPowers.js')
                                    .then(({ Interaction }) => {
                                        log('✓ Interaction module loaded', 'success');
                                        
                                        const interaction = new Interaction(sim, renderer);
                                        log('✓ Interaction system ready', 'success');
                                        log('=== AETHERIA READY ===', 'success');
                                        
                                        // Start game loop
                                        let lastTime = 0;
                                        const TICK_RATE = 100;
                                        
                                        function gameLoop(currentTime) {
                                            const deltaTime = currentTime - lastTime;
                                            
                                            if (deltaTime >= TICK_RATE / sim.clock.speed) {
                                                if (sim.clock.speed > 0) {
                                                    sim.tick();
                                                }
                                                lastTime = currentTime;
                                            }
                                            
                                            renderer.render();
                                            requestAnimationFrame(gameLoop);
                                        }
                                        
                                        requestAnimationFrame(gameLoop);
                                        log('🎮 Game loop started', 'success');
                                    })
                                    .catch(err => log(`✗ Failed to load Interaction: ${err.message}`, 'error'));
                            })
                            .catch(err => log(`✗ Failed to load Renderer: ${err.message}`, 'error'));
                    } catch (err) {
                        log(`✗ Simulation creation failed: ${err.message}`, 'error');
                        log(err.stack, 'error');
                    }
                })
                .catch(err => log(`✗ Failed to load Simulation: ${err.message}`, 'error'));
        } catch (err) {
            log(`Critical error: ${err.message}`, 'error');
            log(err.stack, 'error');
        }
    </script>
</body>
</html>
