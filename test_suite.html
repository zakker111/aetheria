<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Test Suite</title>
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .pass { background: #166534; }
        .fail { background: #991b1b; }
        .info { background: #1e3a8a; }
        h1 { color: #e94560; }
        h2 { color: #fbbf24; margin-top: 30px; }
        #output { max-width: 1200px; }
    </style>
</head>
<body>
    <h1>🧪 Aetheria Test Suite</h1>
    <div id="output"></div>

    <script type="module">
        import { Simulation } from "./src/simulation/simulation.js";
        import { WorldState } from "./src/core/worldState.js";
        import { Agent } from "./src/simulation/agent.js";
        import { Resource } from "./src/simulation/resource.js";
        import { IDGenerator } from "./src/core/idGen.js";

        const output = document.getElementById('output');
        let testsPassed = 0;
        let testsFailed = 0;

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            output.appendChild(div);
            
            if (type === 'pass') testsPassed++;
            if (type === 'fail') testsFailed++;
        }

        function assert(condition, message) {
            if (condition) {
                log(`✅ ${message}`, 'pass');
            } else {
                log(`❌ ${message}`, 'fail');
            }
            return condition;
        }

        // Test 1: World Generation
        log('Testing World Generation...', 'info');
        try {
            const world = new WorldState(64, 64, 12345);
            assert(world.width === 64, 'World width is correct');
            assert(world.height === 64, 'World height is correct');
            
            // Check terrain types exist
            const terrains = new Set();
            for (let y = 0; y < world.height; y++) {
                for (let x = 0; x < world.width; x++) {
                    const terrain = world.getTerrain(x, y);
                    if (terrain) terrains.add(terrain.type);
                }
            }
            assert(terrains.size >= 5, `Multiple biomes generated: ${[...terrains].join(', ')}`);
            assert(terrains.has('water'), 'Water biome exists');
            assert(terrains.has('grassland'), 'Grassland biome exists');
        } catch (e) {
            log(`World generation failed: ${e.message}`, 'fail');
        }

        // Test 2: Agent Creation and Lifecycle
        log('\nTesting Agent System...', 'info');
        try {
            const idGen = new IDGenerator();
            const agent = new Agent(32, 32, idGen);
            assert(agent.alive === true, 'Agent starts alive');
            assert(agent.needs.food === 100, 'Agent starts with full food');
            assert(agent.needs.water === 100, 'Agent starts with full water');
            assert(agent.age === 0, 'Agent starts at age 0');
            
            // Test need decay
            agent.updateNeeds();
            assert(agent.needs.food < 100, 'Food decays over time');
            assert(agent.needs.water < 100, 'Water decays over time');
            assert(agent.age > 0, 'Age increases');
            
            // Test death from starvation
            const starvingAgent = new Agent(32, 32, idGen);
            starvingAgent.needs.food = 0;
            starvingAgent.needs.water = 0;
            starvingAgent.updateNeeds();
            assert(starvingAgent.alive === false, 'Agent dies from starvation/dehydration');
        } catch (e) {
            log(`Agent system failed: ${e.message}`, 'fail');
        }

        // Test 3: Resource System
        log('\nTesting Resource System...', 'info');
        try {
            const idGen = new IDGenerator();
            const foodResource = new Resource(30, 30, 'food', 10, idGen);
            assert(foodResource.resourceType === 'food', 'Resource type is correct');
            assert(foodResource.amount === 10, 'Resource amount is correct');
            
            // Test resource depletion
            foodResource.amount -= 5;
            foodResource.update();
            assert(foodResource.amount > 0, 'Resource not yet depleted');
        } catch (e) {
            log(`Resource system failed: ${e.message}`, 'fail');
        }

        // Test 4: Full Simulation
        log('\nTesting Full Simulation...', 'info');
        try {
            const sim = new Simulation(54321);
            assert(sim.agents.length === 20, 'Initial agents created (20)');
            assert(sim.resources.length > 0, 'Initial resources created');
            assert(sim.world !== null, 'World initialized');
            
            // Run simulation for 10 ticks
            for (let i = 0; i < 10; i++) {
                sim.tick();
            }
            
            assert(sim.clock.tick === 10, 'Clock advances correctly');
            assert(sim.agents.some(a => a.alive), 'Some agents still alive after 10 ticks');
            
            // Test serialization
            const data = sim.serialize();
            assert(data.agents.length > 0, 'Serialization includes agents');
            assert(data.clock !== undefined, 'Serialization includes clock');
            
            // Test deserialization
            const loadedSim = Simulation.deserialize(data);
            assert(loadedSim.agents.length === sim.agents.length, 'Deserialization restores agents');
            assert(loadedSim.clock.tick === sim.clock.tick, 'Deserialization restores clock');
        } catch (e) {
            log(`Full simulation failed: ${e.message}`, 'fail');
            console.error(e);
        }

        // Test 5: Relationship System
        log('\nTesting Relationship System...', 'info');
        try {
            const sim = new Simulation();
            sim.relationshipSystem.initializeAgent(1);
            sim.relationshipSystem.initializeAgent(2);
            
            sim.relationshipSystem.setRelationship(1, 2, { friendship: 50 });
            const rel = sim.relationshipSystem.getRelationship(1, 2);
            assert(rel !== null, 'Relationship created');
            assert(rel.friendship === 50, 'Friendship value set correctly');
            
            sim.relationshipSystem.modifyRelationship(1, 2, { friendship: 10 });
            const updatedRel = sim.relationshipSystem.getRelationship(1, 2);
            assert(updatedRel.friendship === 60, 'Friendship modified correctly');
        } catch (e) {
            log(`Relationship system failed: ${e.message}`, 'fail');
        }

        // Test 6: Settlement System
        log('\nTesting Settlement System...', 'info');
        try {
            const sim = new Simulation();
            
            // Create clustered agents
            for (let i = 0; i < 5; i++) {
                sim.agents[i].x = 30 + Math.random() * 5;
                sim.agents[i].y = 30 + Math.random() * 5;
            }
            
            const clusters = sim.settlementSystem.detectSettlements(sim.agents, sim.world);
            assert(clusters.length >= 0, 'Settlement detection runs without error');
            
            // Test settlement creation
            if (clusters.length > 0) {
                sim.settlementSystem.updateSettlements(clusters, sim.agents);
                assert(sim.settlementSystem.settlements.size >= 0, 'Settlements created');
            }
        } catch (e) {
            log(`Settlement system failed: ${e.message}`, 'fail');
        }

        // Test 7: Economy System
        log('\nTesting Economy System...', 'info');
        try {
            const sim = new Simulation();
            const agent = sim.agents[0];
            
            // Assign job
            const availableJobs = ['gatherer', 'farmer', 'miner'];
            sim.economySystem.assignJob(agent, availableJobs);
            
            const jobData = sim.economySystem.getAgentJob(agent.id);
            assert(jobData !== null, 'Job assigned');
            assert(jobData.job !== 'unemployed', 'Job is not unemployed');
            
            // Check market prices
            assert(sim.economySystem.marketPrices.food > 0, 'Market prices exist');
        } catch (e) {
            log(`Economy system failed: ${e.message}`, 'fail');
        }

        // Test 8: Event System
        log('\nTesting Event System...', 'info');
        try {
            const sim = new Simulation();
            
            // Force event check
            sim.clock.tick = 50;
            const newEvent = sim.eventSystem.checkForNewEvents(
                sim.clock.tick,
                sim.agents,
                Array.from(sim.settlementSystem.settlements.values()),
                sim.world
            );
            
            // Event may or may not occur (random), but system should work
            log('Event system check completed', 'pass');
            
            // Test active events management
            sim.eventSystem.updateActiveEvents(sim.clock.tick, sim);
            log('Active events update completed', 'pass');
        } catch (e) {
            log(`Event system failed: ${e.message}`, 'fail');
        }

        // Test 9: Faction System
        log('\nTesting Faction System...', 'info');
        try {
            const sim = new Simulation();
            
            // Force faction formation
            sim.clock.tick = 100;
            const newFactions = sim.factionSystem.checkForNewFactions(
                sim.agents,
                sim.relationshipSystem
            );
            
            log('Faction system check completed', 'pass');
            
            // Test recruitment
            sim.factionSystem.recruitMembers(
                sim.agents,
                sim.settlementSystem.settlements,
                sim.relationshipSystem
            );
            log('Faction recruitment completed', 'pass');
        } catch (e) {
            log(`Faction system failed: ${e.message}`, 'fail');
        }

        // Test 10: God Powers
        log('\nTesting God Powers...', 'info');
        try {
            const sim = new Simulation();
            const initialAgents = sim.agents.length;
            
            // Spawn agent
            sim.spawnAgent(32, 32);
            assert(sim.agents.length === initialAgents + 1, 'Agent spawned successfully');
            
            // Create resource
            const initialResources = sim.resources.length;
            sim.createResource(35, 35, 'food', 20);
            assert(sim.resources.length === initialResources + 1, 'Resource created successfully');
            
            // Remove resource
            sim.removeResource(35, 35);
            assert(sim.resources.length === initialResources, 'Resource removed successfully');
        } catch (e) {
            log(`God powers failed: ${e.message}`, 'fail');
        }

        // Summary
        log('\n' + '='.repeat(50), 'info');
        log(`TEST SUMMARY: ${testsPassed} passed, ${testsFailed} failed`, testsFailed === 0 ? 'pass' : 'fail');
        log('='.repeat(50), 'info');

        if (testsFailed === 0) {
            log('🎉 All tests passed! Game is ready to play.', 'pass');
        } else {
            log('⚠️ Some tests failed. Check console for details.', 'fail');
        }
    </script>
</body>
</html>
